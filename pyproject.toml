[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[project]
authors = [
  {name = "Shahab Bahreini Jangjoo", email = "shahabahreini@hotmail.com"},
]
dependencies = [
  # Core: configure, train (YOLO/RF-DETR), predict, prepare, augment, benchmark, TUI.
  "ultralytics>=8.4,<9",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "rfdetr[train,loggers,plus]>=1.6.5.post0,<2",
  "pycocotools>=2.0.11",
  "opencv-python-headless>=4.10,<6",
  "numpy>=1.24.4,<3",
  "Pillow>=9.0",
  "albumentations>=1.4,<3",
  "scikit-learn>=1.3,<2",
  "plotly>=5.0,<8",
  "tensorboard>=2.16,<3",
  "roboflow>=1.1,<2",
  "requests>=2.31,<3",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "rich>=13.7",
  "blessed>=1.20",
  "python-dotenv>=1.0",
  "packaging>=23",
  "psutil>=5.9",
  "platformdirs>=4.2",
  "keyring>=25",
]
description = "Automated object-detection training utilities and CLI — configure, train, predict, benchmark, and upload YOLO26, YOLOv12, YOLOv11, YOLOv10, YOLOv9, YOLOv8, YOLOX, RF-DETR, and SAM 3.1 models with an interactive terminal interface."
keywords = [
  "yolo",
  "yolo26",
  "yolov12",
  "yolov11",
  "yolov10",
  "yolov9",
  "yolov8",
  "yolox",
  "rf-detr",
  "sam-3.1",
  "segment-anything",
  "detectron2",
  "object-detection",
  "instance-segmentation",
  "computer-vision",
  "deep-learning",
  "machine-learning",
  "ultralytics",
  "pytorch",
  "training-cli",
  "fine-tuning",
  "tui",
  "clearml",
  "roboflow",
  "coco",
  "ndjson",
  "labelbox",
  "dataset-tools",
  "dataset-augmentation",
  "model-benchmarking",
  "model-training",
  "automated-training",
  "edge-deployment",
  "onnx",
  "cuda",
  "mps",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
license = "Apache-2.0"
name = "yolomatic"
readme = "README.md"
requires-python = ">=3.12,<3.14"
version = "7.0.0"

[project.urls]
Changelog = "https://github.com/shahabahreini/YOLOMatic/blob/main/CHANGELOG.md"
Documentation = "https://shahabahreini.github.io/YOLOMatic/"
Funding = "https://github.com/sponsors"
Homepage = "https://github.com/shahabahreini/YOLOMatic"
Issues = "https://github.com/shahabahreini/YOLOMatic/issues"
Repository = "https://github.com/shahabahreini/YOLOMatic"

[project.optional-dependencies]
# Extra export formats (ONNX/TensorFlow/CoreML/OpenVINO/NCNN). Ultralytics
# needs these only for the matching `export(format=...)`.
export = [
  "onnx>=1.16,<2",
  "onnxslim>=0.1.71",
  "onnxruntime>=1.18,<2",
  "rfdetr[onnx]>=1.6.5.post0,<2",
  "openvino>=2024.0.0",
  "ncnn>=1.0.3",
  "tensorflow>=2.16,<2.22; sys_platform != 'win32'",
  "coremltools>=7.1.0; sys_platform != 'win32'",
]
# TensorRT engines (NVIDIA GPUs on Linux/Windows).
tensorrt = [
  "tensorrt-cu12==11.1.0.106; sys_platform != 'darwin'",
]
# ClearML experiment tracking.
clearml = [
  "clearml>=1.16,<3",
]
# UMAP embeddings in benchmark reports (falls back to PCA without it).
viz = [
  "umap-learn>=0.5",
]
# SAM 3.1 fine-tuning and segmentation.
sam = [
  "transformers>=5.8,<6",
  "accelerate>=0.26",
]
all = [
  "yolomatic[export,tensorrt,clearml,viz,sam]",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material[imaging]>=9.5",
  "pymdown-extensions>=10.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/yolomatic"]

[tool.hatch.build.targets.sdist]
include = ["/src/yolomatic", "/tests", "/README.md", "/LICENSE.md", "/CHANGELOG.md"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.12",
  "pyrefly>=0.30",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Preview is enabled only for explicitly selected preview rules (PLW1514).
preview = true
explicit-preview-rules = true
select = [
  "E", "F",      # pycodestyle errors, pyflakes
  "B",           # bugbear: likely bugs and design problems
  "UP",          # pyupgrade: modern syntax for the supported Python
  "I",           # import sorting
  "S306",        # tempfile.mktemp (race condition)
  "PLW1514",     # open()/read_text() without an explicit encoding
]
ignore = [
  "E501",        # line length is handled by review, not lint
  "B023",        # closures over loop vars: all current uses run inside the iteration
  "B905",        # zip(strict=...): many call sites intentionally zip unequal lengths
  "UP042",       # StrEnum changes str() semantics of existing enums
  "UP046", "UP047",  # PEP 695 generics: style only
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]

[tool.ruff.lint.isort]
known-first-party = ["yolomatic"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
tensorrt-cu12 = [
  { index = "nvidia" },
]

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu12"
version = "11.1.0.106"
requires-dist = ["tensorrt-cu12-libs==11.1.0.106", "tensorrt-cu12-bindings==11.1.0.106"]

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu12-bindings"
version = "11.1.0.106"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu12-libs"
version = "11.1.0.106"
requires-dist = []

[tool.uv]
required-version = ">=0.8.0"
# Albumentations and Roboflow request the headless wheel while Ultralytics and
# NCNN request the desktop wheel. Both publish the same ``cv2`` namespace, so
# the application must install exactly one variant. The project depends on
# opencv-python-headless directly (above); the override forces every transitive
# request for the headless wheel to the same version range, and the excludes
# stop any transitive dependency from pulling in a conflicting desktop or
# contrib variant.
override-dependencies = ["opencv-python-headless >= 4.10"]
exclude-dependencies = [
  "opencv-python",
  "opencv-contrib-python",
  "opencv-contrib-python-headless",
]

[project.scripts]
yolomatic = "yolomatic.cli.run:main"
yolomatic-predict = "yolomatic.cli.entrypoints:predict"
yolomatic-tensorboard = "yolomatic.cli.entrypoints:tensorboard"
yolomatic-train = "yolomatic.cli.entrypoints:train"
yolomatic-upload = "yolomatic.cli.entrypoints:upload"
yolomatic-upload-dataset = "yolomatic.cli.entrypoints:upload_dataset"
yolomatic-benchmark = "yolomatic.cli.entrypoints:benchmark"
yolomatic-sam = "yolomatic.cli.entrypoints:sam"
yolomatic-convert = "yolomatic.cli.entrypoints:convert"
yolomatic-prepare = "yolomatic.cli.entrypoints:prepare"
yolomatic-ultralytics = "yolomatic.cli.entrypoints:ultralytics"
yolomatic-export = "yolomatic.cli.entrypoints:export"
yolomatic-augment = "yolomatic.cli.entrypoints:augment"

[tool.pyrefly]
project-includes = ["src/yolomatic"]
search-path = ["src"]
