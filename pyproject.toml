[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[project]
authors = [
  {name = "Shahab Bahreini Jangjoo", email = "shahabahreini@hotmail.com"},
]
dependencies = [
  "ultralytics",
  "clearml",
  "pyyaml",
  "opencv-python-headless>=4.10,<6",
  "numpy>=1.24.4",
  "torch",
  "torchvision",
  "tensorboard",
  "tensorflow>=2.16,<2.22; sys_platform != 'win32'",
  "onnx",
  "onnxslim>=0.1.71",
  "onnxruntime",
  "tabulate",
  "termcolor",
  "ruamel.yaml",
  "terminaltables",
  "blessed",
  "rich",
  "python-dotenv",
  "roboflow",
  "rfdetr[train,onnx,loggers,plus]>=1.6.5.post0",
  "packaging",
  "psutil",
  "pycocotools>=2.0.11",
  "transformers>=5.8,<6",
  "accelerate>=0.26",
  "plotly>=5.0",
  "umap-learn>=0.5",
  "Pillow>=9.0",
  "albumentations>=1.4",
  "openvino>=2024.0.0",
  "coremltools>=7.1.0; sys_platform != 'win32'",
  "ncnn>=1.0.3",
  "tensorrt-cu12==11.1.0.106; sys_platform != 'darwin'",
  "platformdirs>=4.2",
]
description = "Automated object-detection training utilities and CLI — configure, train, predict, benchmark, and upload YOLO26, YOLOv12, YOLOv11, YOLOv10, YOLOv9, YOLOv8, YOLOX, RF-DETR, and SAM 3.1 models with an interactive terminal interface."
keywords = [
  "yolo",
  "yolo26",
  "yolov12",
  "yolov11",
  "yolov10",
  "yolov9",
  "yolov8",
  "yolox",
  "rf-detr",
  "sam-3.1",
  "segment-anything",
  "detectron2",
  "object-detection",
  "instance-segmentation",
  "computer-vision",
  "deep-learning",
  "machine-learning",
  "ultralytics",
  "pytorch",
  "training-cli",
  "fine-tuning",
  "tui",
  "clearml",
  "roboflow",
  "coco",
  "ndjson",
  "labelbox",
  "dataset-tools",
  "dataset-augmentation",
  "model-benchmarking",
  "model-training",
  "automated-training",
  "edge-deployment",
  "onnx",
  "cuda",
  "mps",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
license = "Apache-2.0"
name = "yolomatic"
readme = "README.md"
requires-python = ">=3.12,<3.13"
version = "6.4.0"

[project.urls]
Changelog = "https://github.com/shahabahreini/YOLOMatic/blob/main/CHANGELOG.md"
Documentation = "https://shahabahreini.github.io/YOLOMatic/"
Funding = "https://github.com/sponsors"
Homepage = "https://github.com/shahabahreini/YOLOMatic"
Issues = "https://github.com/shahabahreini/YOLOMatic/issues"
Repository = "https://github.com/shahabahreini/YOLOMatic"

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material[imaging]>=9.5",
  "pymdown-extensions>=10.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/yolomatic"]

[tool.hatch.build.targets.sdist]
include = ["/src/yolomatic", "/tests", "/README.md", "/LICENSE.md", "/CHANGELOG.md"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
tensorrt-cu12 = [
  { index = "nvidia" },
]

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu12"
version = "11.1.0.106"
requires-dist = ["tensorrt-cu12-libs==11.1.0.106", "tensorrt-cu12-bindings==11.1.0.106"]

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu12-bindings"
version = "11.1.0.106"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu12-libs"
version = "11.1.0.106"
requires-dist = []

[tool.uv]
required-version = ">=0.8.0"
# Albumentations and Roboflow request the headless wheel while Ultralytics and
# NCNN request the desktop wheel. Both publish the same ``cv2`` namespace, so
# the application must install exactly one variant. The project depends on
# opencv-python-headless directly (above); the override forces every transitive
# request for the headless wheel to the same version range, and the excludes
# stop any transitive dependency from pulling in a conflicting desktop or
# contrib variant.
override-dependencies = ["opencv-python-headless >= 4.10"]
exclude-dependencies = [
  "opencv-python",
  "opencv-contrib-python",
  "opencv-contrib-python-headless",
]

[project.scripts]
yolomatic = "yolomatic.cli.run:main"
yolomatic-predict = "yolomatic.cli.entrypoints:predict"
yolomatic-tensorboard = "yolomatic.cli.entrypoints:tensorboard"
yolomatic-train = "yolomatic.cli.entrypoints:train"
yolomatic-upload = "yolomatic.cli.entrypoints:upload"
yolomatic-upload-dataset = "yolomatic.cli.entrypoints:upload_dataset"
yolomatic-benchmark = "yolomatic.cli.entrypoints:benchmark"
yolomatic-sam = "yolomatic.cli.entrypoints:sam"
yolomatic-convert = "yolomatic.cli.entrypoints:convert"
yolomatic-prepare = "yolomatic.cli.entrypoints:prepare"
yolomatic-ultralytics = "yolomatic.cli.entrypoints:ultralytics"
yolomatic-export = "yolomatic.cli.entrypoints:export"
yolomatic-augment = "yolomatic.cli.entrypoints:augment"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
