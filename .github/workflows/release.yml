name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Verify and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify mainline tag and release metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          tag_version="${GITHUB_REF_NAME#v}"
          # Read the version with plain Python; `uv run` would sync the whole ML stack.
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag_version" = "$package_version" || { echo "::error::tag $tag_version != pyproject $package_version"; exit 1; }
          grep -Eq "^## \[v?${package_version//./\\.}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for ${package_version}"; exit 1; }
          grep -Eq "^version: \"?${package_version//./\\.}\"?$" CITATION.cff || { echo "::error::CITATION.cff version is not ${package_version}"; exit 1; }

      - name: Build package
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    name: Publish to PyPI
    needs: build
    # Opt-in: set the repository variable PUBLISH_TO_PYPI=true after configuring a
    # PyPI trusted publisher for this repo (workflow: release.yml, environment: pypi).
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/yolomatic/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
