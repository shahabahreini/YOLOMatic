name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run Ruff
        # Ruff is self-contained; no need to install the ML stack for linting.
        run: uvx ruff@0.16.9 check src tests

  typecheck:
    # Informational for now (pre-existing Optional-narrowing findings); the
    # report is visible in the job log. Make blocking once the count is zero.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked --group dev --python 3.12

      - name: Run pyrefly
        run: uv run pyrefly check

  audit:
    # Known-vulnerability scan of the locked dependency set (informational).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Audit locked dependencies
        run: |
          uv export --locked --all-extras --no-hashes --no-emit-project --format requirements-txt > requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt --no-deps --disable-pip --progress-spinner off

  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check uv.lock is up to date
        run: uv lock --check

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
        python:
          - "3.12"
        include:
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync environment
        # Base install only: the suite must pass without the optional extras.
        run: uv sync --locked --group dev --python ${{ matrix.python }}

      - name: Compile sources
        run: uv run python -m compileall -q src

      - name: Run tests
        run: uv run pytest -q --cov=yolomatic --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: ignore
